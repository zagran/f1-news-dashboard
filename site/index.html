<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Новини F1</title>
  <meta name="description" content="Останні новини Формули 1 з Formula1.com, FIA, The Race, Autosport і Sky Sports в одному місці.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231c1c1a'/%3E%3Cpath d='M3 3h3v3H3zM9 3h3v3H9zM6 6h3v3H6zM3 9h3v3H3zM9 9h3v3H9z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#latest" data-i18n="skip">Перейти до новин</a>
  <div class="wrap">
    <header class="head">
      <div class="head-text">
        <h1 data-i18n="title">Новини F1</h1>
        <p class="sub" id="summary" aria-live="polite">Завантажуємо новини…</p>
        <p class="warn" id="warn" hidden></p>
        <p class="tstatus" id="tstatus" aria-live="polite" hidden></p>
      </div>
      <div class="tools">
        <div class="lang" role="group" aria-label="Мова" data-i18n-aria="language">
          <button type="button" data-lang="uk" lang="uk" aria-label="Українська" aria-pressed="true">UA</button>
          <button type="button" data-lang="en" lang="en" aria-label="English" aria-pressed="false">EN</button>
        </div>
        <label class="search">
          <span class="visually-hidden" data-i18n="searchLabel">Пошук новин</span>
          <input id="q" type="search" placeholder="Пошук, напр. Ферстаппен" data-i18n-placeholder="searchPlaceholder" autocomplete="off" spellcheck="false">
        </label>
      </div>
    </header>

    <main class="grid">
      <section class="card" id="latest" aria-labelledby="latest-h">
        <div class="card-head">
          <h2 id="latest-h" data-i18n="latest">Останні новини</h2>
          <p class="note" id="latest-note"></p>
        </div>
        <div class="chips" id="chips" role="group" aria-label="Джерело" data-i18n-aria="sourceGroup"></div>
        <div class="list" id="timeline"></div>
        <p class="empty" id="timeline-empty" data-i18n="noMatch" hidden>Нічого не знайдено.</p>
      </section>
      <div class="side" id="side"></div>
    </main>

    <footer class="foot">
      <p><span data-i18n="footer">Неофіційний сайт. Заголовки, описи й посилання належать їхнім видавцям. Стрічки перевіряються кожні 30 хвилин.</span> <a href="data/news.json" data-i18n="rawData">Дані (JSON)</a></p>
    </footer>
  </div>
</body>
</html>
